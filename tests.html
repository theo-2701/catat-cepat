<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Catat Cepat – self-check</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 16px; }
    h1 { font-size: 1.2rem; }
    #summary { font-weight: 700; }
    .pass { color: #15803d; }
    .fail { color: #b42318; }
    @media (prefers-color-scheme: dark) { .pass { color: #4ade80; } .fail { color: #f87171; } }
    li { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Self-check: logika di core.js</h1>
  <p id="summary">Menjalankan…</p>
  <ul id="results"></ul>
  <script src="core.js"></script>
  <script src="wallets.js"></script>
  <script>
    'use strict';
    const results = [];
    function check(name, fn) {
      try { fn(); results.push([true, name]); } catch (e) { results.push([false, `${name}: ${e.message}`]); }
    }
    function assertEq(actual, expected) {
      const a = JSON.stringify(actual);
      const b = JSON.stringify(expected);
      if (a !== b) throw new Error(`dapat ${a}, harusnya ${b}`);
    }

    // parseAmount
    const amounts = {
      '25000': 25000, '25k': 25000, '25rb': 25000, '25 rb': 25000, '100ribu': 100000,
      '1,5jt': 1500000, '1.5jt': 1500000, '1,25 juta': 1250000, '2jt': 2000000, '0,5k': 500,
      '25.000': 25000, '1.250.000': 1250000, '1.250.000,50': 1250001, 'Rp 30rb': 30000, '12,5': 13,
    };
    for (const [input, want] of Object.entries(amounts)) check(`parseAmount("${input}") = ${want}`, () => assertEq(parseAmount(input), want));
    check('parseAmount("") = null', () => assertEq(parseAmount(''), null));
    for (const bad of ['abc', '25x', '1.25.000', 'rb']) check(`parseAmount("${bad}") = NaN`, () => assertEq(Number.isNaN(parseAmount(bad)), true));

    // toWire
    check('toWire sends only contract fields', () => assertEq(
      toWire({ clientId: 'a', date: '2026-10-31', amount: 5, category: 'Transfer', wallet: 'BCA', to: 'GoPay', type: 'Transfer', status: 'error', error: 'x', createdAt: 1 }),
      { clientId: 'a', date: '2026-10-31', amount: 5, category: 'Transfer', wallet: 'BCA', notes: '', goal: '', to: 'GoPay' }));

    // settleBatch
    const batch = ['a', 'b', 'c', 'd'].map((clientId) => ({ clientId }));
    check('saved and duplicate leave the outbox; error and missing stay', () => {
      const r = settleBatch(batch, { ok: true, results: [
        { clientId: 'a', status: 'saved', ids: ['1'] },
        { clientId: 'b', status: 'duplicate', ids: ['0'] },
        { clientId: 'c', status: 'error', ids: [], error: 'Kategori tidak dikenal' },
      ] });
      assertEq(r.sent, ['a', 'b']);
      assertEq(r.failed.map((f) => [f.item.clientId, f.error]), [['c', 'Kategori tidak dikenal'], ['d', 'Tidak ada hasil dari server untuk transaksi ini']]);
      assertEq(r.fatal, '');
    });
    check('unknown status keeps the item', () => {
      const r = settleBatch([{ clientId: 'a' }], { ok: true, results: [{ clientId: 'a', status: 'queued' }] });
      assertEq([r.sent, r.failed.length], [[], 1]);
    });
    check('ok:false keeps every item with the server message', () => {
      const r = settleBatch(batch, { ok: false, error: 'Token tidak valid' });
      assertEq([r.sent, r.failed.length, r.fatal, r.failed[0].error], [[], 4, 'Token tidak valid', 'Token tidak valid']);
    });
    check('empty or broken reply keeps every item', () => {
      assertEq(settleBatch(batch, null).failed.length, 4);
      assertEq(settleBatch(batch, { ok: true }).failed.length, 4);
    });

    // validateEntry: same order as the form, first problem wins
    const ok = { amount: 25000, category: 'Makan & Minum', type: 'Expense', wallet: 'BCA', goal: '', to: '', date: '2026-10-31' };
    check('validateEntry accepts a complete expense', () => assertEq(validateEntry(ok), null));
    const field = (patch) => (validateEntry({ ...ok, ...patch }) || {}).field;
    check('validateEntry: amount first', () => assertEq(field({ amount: null, category: '' }), 'amount'));
    check('validateEntry: NaN or 0 amount', () => assertEq([field({ amount: NaN }), field({ amount: 0 })], ['amount', 'amount']));
    check('validateEntry: category', () => assertEq(field({ category: '' }), 'category'));
    check('validateEntry: wallet', () => assertEq(field({ wallet: '' }), 'wallet'));
    check('validateEntry: Tabungan needs a goal', () => assertEq(field({ category: 'Tabungan', type: 'Saving' }), 'goal'));
    check('validateEntry: Transfer needs a different destination', () => assertEq(
      [field({ category: 'Transfer', type: 'Transfer' }), field({ category: 'Transfer', type: 'Transfer', to: 'BCA' }), field({ category: 'Transfer', type: 'Transfer', to: 'GoPay' })],
      ['to', 'to', undefined]));
    check('validateEntry: date', () => assertEq(field({ date: '' }), 'date'));
    check('validateEntry gives a short reason for the button', () => assertEq(validateEntry({ ...ok, amount: null }).short, 'Isi jumlah dulu'));

    // Days, money, names, colors
    check('dayLabel today / yesterday / weekday', () => assertEq(
      [dayLabel('2026-10-31', '2026-10-31'), dayLabel('2026-10-30', '2026-10-31'), dayLabel('2026-10-28', '2026-10-31'), dayLabel('2025-12-31', '2026-01-02')],
      ['Hari ini', 'Kemarin', 'Rab, 28 Okt', 'Rab, 31 Des 2025']));
    check('dayLabel across a month boundary', () => assertEq(dayLabel('2026-10-31', '2026-11-01'), 'Kemarin'));
    check('groupByDay: newest day first, order kept within a day', () => {
      const g = groupByDay([{ id: 1, date: '2026-10-30' }, { id: 2, date: '2026-10-31' }, { id: 3, date: '2026-10-31' }], '2026-10-31');
      assertEq(g.map((d) => [d.label, d.items.map((i) => i.id)]), [['Hari ini', [2, 3]], ['Kemarin', [1]]]);
    });
    check('formatRp', () => assertEq([formatRp(25000), formatRp(-1500), formatRp(500, '+')], ['Rp25.000', '−Rp1.500', '+Rp500']));
    check('formatShort', () => assertEq(
      [formatShort(45000), formatShort(2400000), formatShort(2000000), formatShort(-1250000), formatShort(undefined)],
      ['Rp45.000', 'Rp2,4jt', 'Rp2jt', '−Rp1,3jt', 'Rp0']));
    check('firstName', () => assertEq([firstName('theo.wijaya@gmail.com'), firstName('Theo Wijaya'), firstName(''), firstName(null)], ['Theo', 'Theo', '', '']));
    check('catColor is stable and from the palette', () => {
      assertEq(catColor('Makan & Minum'), catColor('Makan & Minum'));
      assertEq(TAG_COLORS.includes(catColor('Gaji')), true);
    });

    // Account numbers
    check('isValidAccount', () => assertEq(
      ['1234567890', '0812-3456-7890', '+62 812 3456', '', 'abc123', '12+3'].map(isValidAccount),
      [true, true, true, true, false, false]));
    check('cleanAccount keeps digits and a leading +', () => assertEq(
      [cleanAccount('0812-3456 7890'), cleanAccount(' +62 812.3456 '), cleanAccount('')], ['081234567890', '+628123456', '']));
    check('groupDigits in fours', () => assertEq(
      [groupDigits('1234567890'), groupDigits('+62812345'), groupDigits('')], ['1234 5678 90', '+6281 2345', '']));

    // Wallet card styles
    check('walletStyle matches names loosely', () => assertEq(
      ['BCA', 'Bank Jago', 'GoPay', 'CIMB Niaga', 'ShopeePay', 'Cash'].map((n) => walletStyle(n).key),
      ['bca', 'jago', 'gopay', 'cimbniaga', 'shopeepay', 'cash']));
    check('walletStyle gives unknown wallets a stable fallback', () => {
      const a = walletStyle('Dompet Rahasia');
      assertEq([a.key, a.mark, a.from === walletStyle('Dompet Rahasia').from, WALLET_FALLBACKS.some((f) => f[0] === a.from)], ['', 'Dompet Rahasia', true, true]);
    });

    const failed = results.filter((r) => !r[0]).length;
    document.getElementById('summary').textContent = failed ? `${failed} dari ${results.length} GAGAL` : `Semua ${results.length} cek lolos`;
    document.getElementById('summary').className = failed ? 'fail' : 'pass';
    document.getElementById('results').replaceChildren(...results.map(([ok, name]) => {
      const li = document.createElement('li');
      li.className = ok ? 'pass' : 'fail';
      li.textContent = `${ok ? 'LOLOS' : 'GAGAL'} — ${name}`;
      return li;
    }));
  </script>
</body>
</html>
